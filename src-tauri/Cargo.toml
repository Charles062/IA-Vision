[package]
name = "second-brain"
version = "0.1.0"
description = "A local second brain powered by Tauri and local LLMs"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
tauri-plugin-shell = "2.0.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
# Capture and OCR
xcap = "0.0.6" # Cross-platform screen capture
image = "0.25" # Image processing
active-win-pos-rs = "0.8" # Active window metadata

# Database (Placeholder for now, but part of the stack)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# OCR Engine
ocrs = "0.4"
rten = "0.4"
rten-tensor = "0.4"
